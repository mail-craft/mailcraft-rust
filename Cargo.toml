[package]
name = "mailcraft"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Official Rust SDK for the MailCraft email API — transactional email, SMTP relay, marketing campaigns, automations, and contact management."
license = "MIT"
repository = "https://github.com/mail-craft/mailcraft-rust"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
